services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    profiles: [ "app" ]
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobtracker
      DB_USERNAME: jobtracker
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    profiles: [ "ai" ]
    mem_limit: 4g
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  ollama-init:
    image: ollama/ollama:latest
    profiles: [ "ai" ]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ "ollama" ]
    command: [ "pull", "qwen3:1.7b" ]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"


volumes:
  postgres_data:
  ollama_data: